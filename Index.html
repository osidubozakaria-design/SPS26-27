<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPS 26/27 — Player Ranking System</title>
<style>
  :root {
    --bg: #020805;
    --card: #07150D;
    --card-hover: #0C1F14;
    --gold: #D4AF37;
    --gold-dim: #A88B2A;
    --white: #F5F5F5;
    --gray: #9BAA9F;
    --muted: #5A6B5E;
    --border: #145C31;
    --row-alt: #0A1F14;
    --pts-green: #00FF66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, system-ui, sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    line-height: 1.4;
  }
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---- MAIN MENU ---- */
  .menu-header {
    text-align: center;
    padding: 1.25rem 1rem 0.5rem;
  }
  .menu-header .emoji { font-size: 2.6rem; line-height: 1; }
  .menu-header h1 {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--white);
    letter-spacing: 0.02em;
  }
  .menu-header .sub {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.08em;
    margin-top: 0.15rem;
  }
  .menu-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 1.25rem 1.5rem;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .menu-card {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 0.45rem;
    padding: 0.55rem 0.7rem;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .menu-card:hover { background: var(--card-hover); border-color: var(--gold-dim); }
  .menu-card .icon {
    font-size: 1.35rem;
    width: 2.6rem;
    text-align: center;
    flex-shrink: 0;
  }
  .menu-card .sep {
    width: 2px;
    align-self: stretch;
    background: var(--border);
    margin: 0.2rem 0.7rem 0.2rem 0.3rem;
    flex-shrink: 0;
  }
  .menu-card .texts { flex: 1; min-width: 0; }
  .menu-card .title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--white);
  }
  .menu-card .subtitle {
    font-size: 0.7rem;
    color: var(--gray);
    margin-top: 0.1rem;
  }
  .menu-card .open-btn {
    background: var(--gold);
    color: var(--bg);
    border: none;
    font-weight: 700;
    font-size: 0.72rem;
    padding: 0.4rem 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 0.5rem;
  }
  .menu-card .open-btn:hover { background: #E5C45A; }

  /* ---- TOP BAR (ranking screens) ---- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .btn-back, .btn-gold {
    font-weight: 700;
    font-size: 0.8rem;
    padding: 0.4rem 0.9rem;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .btn-back {
    background: var(--card);
    color: var(--gold);
  }
  .btn-back:hover { border-color: var(--gold); }
  .btn-gold {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
  }
  .btn-gold:hover { background: #E5C45A; }

  .screen-title {
    text-align: center;
    padding: 0 1rem 0.25rem;
  }
  .screen-title h2 {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--white);
  }
  .screen-title .sub {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--gold);
    margin-top: 0.15rem;
  }

  /* filters on ranking table */
  .filters {
    max-width: 900px;
    margin: 0.5rem auto 0;
    padding: 0 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .filters input, .filters select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--white);
    padding: 0.4rem 0.65rem;
    border-radius: 5px;
    font-size: 0.85rem;
    outline: none;
  }
  .filters input { flex: 1 1 160px; }
  .filters input:focus, .filters select:focus { border-color: var(--gold); }

  .note {
    text-align: center;
    font-size: 0.78rem;
    color: var(--gray);
    padding: 0.5rem 1rem;
  }

  /* ranking table */
  .table-wrap {
    flex: 1;
    overflow: auto;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    padding: 0 0.75rem 1.5rem;
  }
  table.rank-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  table.rank-table thead th {
    text-align: left;
    padding: 0.55rem 0.5rem;
    color: var(--gold);
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    background: var(--card);
    border: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  table.rank-table thead th.num { text-align: right; }
  table.rank-table thead th.rank { text-align: center; width: 2.8rem; }
  table.rank-table tbody tr { background: var(--card); }
  table.rank-table tbody tr:nth-child(even) { background: var(--row-alt); }
  table.rank-table tbody tr:hover { background: var(--card-hover); cursor: pointer; }
  table.rank-table td {
    padding: 0.55rem 0.5rem;
    border-bottom: 1px solid rgba(20, 92, 49, 0.35);
  }
  table.rank-table td.rank {
    text-align: center;
    font-weight: 700;
    color: var(--gold);
  }
  table.rank-table td.pts {
    text-align: right;
    font-weight: 700;
    color: var(--pts-green);
    font-variant-numeric: tabular-nums;
  }
  .pos-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--gold);
    background: rgba(20, 92, 49, 0.4);
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
  }
  .empty-row { color: var(--muted); text-align: center; padding: 2rem; }

  /* detail overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.open { display: flex; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    width: 100%;
    max-width: 520px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 1.25rem;
  }
  .panel h3 { color: var(--gold); font-size: 1.25rem; margin-bottom: 0.35rem; }
  .panel .meta { color: var(--gray); font-size: 0.85rem; margin-bottom: 1rem; }
  .panel .big-pts {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--gold);
    margin-bottom: 1rem;
  }
  .panel .big-pts span { font-size: 0.75rem; color: var(--gray); font-weight: 600; display: block; }
  .comp-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7rem 0.85rem;
    margin-bottom: 0.5rem;
  }
  .comp-item h4 {
    font-size: 0.82rem;
    color: var(--gold-dim);
    margin-bottom: 0.3rem;
    display: flex;
    justify-content: space-between;
  }
  .comp-item .stats {
    font-size: 0.78rem;
    color: var(--gray);
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 0.9rem;
  }
  .comp-item .stats strong { color: var(--white); }
  .close-x {
    float: right;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--gray);
    width: 1.8rem;
    height: 1.8rem;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
  }
  .close-x:hover { color: var(--gold); border-color: var(--gold); }

  .load-err {
    text-align: center;
    color: #ff6b6b;
    padding: 1rem;
    font-size: 0.85rem;
  }
  @media (max-width: 560px) {
    .menu-header h1 { font-size: 1.7rem; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

<!-- ========== MAIN MENU ========== -->
<div id="screen-main" class="screen active">
  <div class="menu-header">
    <div class="emoji">⚽</div>
    <h1>SPS 26/27</h1>
    <div class="sub">PLAYER RANKING SYSTEM</div>
  </div>
  <div class="menu-scroll" id="main-menu-list"></div>
</div>

<!-- ========== LEAGUES CUP POT ========== -->
<div id="screen-leagues" class="screen">
  <div class="topbar">
    <button class="btn-back" data-goto="main">‹ BACK</button>
  </div>
  <div class="screen-title">
    <h2>LEAGUES CUP POT</h2>
    <div class="sub">Select a league to view its cups &amp; ranking pots</div>
  </div>
  <div class="menu-scroll" id="leagues-list"></div>
</div>

<!-- ========== LEAGUE CUPS ========== -->
<div id="screen-cups" class="screen">
  <div class="topbar">
    <button class="btn-back" data-goto="leagues">‹ BACK</button>
  </div>
  <div class="screen-title">
    <h2 id="cups-title">LEAGUE</h2>
    <div class="sub">League pot &amp; domestic cup competitions</div>
  </div>
  <div class="menu-scroll" id="cups-list"></div>
</div>

<!-- ========== RANKING TABLE ========== -->
<div id="screen-rank" class="screen">
  <div class="topbar">
    <button class="btn-back" id="rank-back">‹ BACK</button>
  </div>
  <div class="screen-title">
    <h2 id="rank-title">RANKING</h2>
    <div class="sub" id="rank-subtitle">TOP PLAYERS</div>
  </div>
  <div class="filters">
    <input type="search" id="search" placeholder="Search player or club…">
    <select id="pos-filter">
      <option value="">All positions</option>
      <option value="CF">CF</option><option value="LWF">LWF</option><option value="RWF">RWF</option>
      <option value="AM">AM</option><option value="CM">CM</option><option value="DM">DM</option>
      <option value="LB">LB</option><option value="CB">CB</option><option value="RB">RB</option>
      <option value="GK">GK</option><option value="LMF">LMF</option><option value="RMF">RMF</option>
    </select>
  </div>
  <div class="note" id="rank-note"></div>
  <div class="table-wrap">
    <table class="rank-table">
      <thead>
        <tr>
          <th class="rank">#</th>
          <th>PLAYER NAME</th>
          <th>POS</th>
          <th class="hide-sm">CLUB</th>
          <th class="num">POINTS</th>
        </tr>
      </thead>
      <tbody id="rank-tbody"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
/* ===== Competition structure (matches Python exactly) ===== */
const MAIN_ITEMS = [
  { key: "BALLON D'OR OVERALL POINTS", title: "1.  BALLON D'OR OVERALL POINTS",
    subtitle: "Overall SPS points across every competition", icon: "🏆", overall: true },
  { key: "CHAMPIONS LEAGUE POT", title: "2.  CHAMPIONS LEAGUE POT",
    subtitle: "Champions League player points", icon: "🏆" },
  { key: "EUROPA LEAGUE POINTS POT", title: "3.  EUROPA LEAGUE POINTS POT",
    subtitle: "Europa League player points", icon: "⚽" },
  { key: "LEAGUES_CUP_POT", title: "4.  LEAGUES CUP POT",
    subtitle: "Domestic league and cup points", icon: "⚽", isLeagues: true },
  { key: "WORLD CUP POT", title: "5.  WORLD CUP POT",
    subtitle: "World Cup player points", icon: "🌐" },
  { key: "INTERNATIONAL CUP POT", title: "6.  INTERNATIONAL CUP POT",
    subtitle: "International tournament points", icon: "🌐" },
  { key: "CLUB WORLD CUP POT", title: "7.  CLUB WORLD CUP POT",
    subtitle: "Club World Cup player points", icon: "🏆" },
  { key: "CAREER OVERALL", title: "8.  CAREER OVERALL",
    subtitle: "Career SPS points and records", icon: "🛡", overall: true },
];

const LEAGUES = {
  "PREMIER LEAGUE": { badge: "PL", cups: ["Premier League Pot", "FA Cup", "EFL Cup (Carabao Cup)", "Community Shield"] },
  "LA LIGA": { badge: "LL", cups: ["La Liga Pot", "Copa del Rey", "Supercopa de España"] },
  "SERIE A": { badge: "A", cups: ["Serie A Pot", "Coppa Italia", "Supercoppa Italiana"] },
  "BUNDESLIGA": { badge: "BL", cups: ["Bundesliga Pot", "DFB-Pokal", "DFL-Supercup"] },
  "LIGUE 1": { badge: "L1", cups: ["Ligue 1 Pot", "Coupe de France", "Trophée des Champions"] },
};

/* Keys that sum ALL competition points (like Python ranked_players_for_competition) */
const OVERALL_KEYS = new Set([
  "BALLON D'OR OVERALL POINTS",
  "CAREER OVERALL",
  "Ballon d'Or Overall Points",
  "Career Overall",
]);

let PLAYERS = [];
let currentCompetition = null;
let currentIsOverall = false;
let rankBackTarget = "main";
let currentLeague = null;

function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function formatPts(n) {
  const x = Number(n) || 0;
  if (Number.isInteger(x)) return String(x);
  return x.toFixed(1).replace(/\.0$/, "");
}

/** Points for ranking: specific comp = only that pot; overall = sum of all pots */
function playerPoints(p, competition, isOverall) {
  if (isOverall || OVERALL_KEYS.has(competition)) {
    // Sum every competition entry (Ballon d'Or / Career)
    const comps = p.competitions || {};
    let total = 0;
    for (const k of Object.keys(comps)) {
      total += Number((comps[k] && comps[k].points) || 0);
    }
    // Prefer stored overall if present and consistent
    if (p.overall != null && Math.abs(p.overall - total) < 0.01) return p.overall;
    return Math.round(total * 100) / 100;
  }
  const entry = (p.competitions || {})[competition];
  return entry ? Number(entry.points || 0) : 0;
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + id).classList.add("active");
}

function buildMainMenu() {
  const box = document.getElementById("main-menu-list");
  box.innerHTML = MAIN_ITEMS.map(item => `
    <div class="menu-card" data-key="${escapeHtml(item.key)}" data-leagues="${item.isLeagues ? 1 : 0}" data-overall="${item.overall ? 1 : 0}">
      <div class="icon">${item.icon}</div>
      <div class="sep"></div>
      <div class="texts">
        <div class="title">${escapeHtml(item.title)}</div>
        <div class="subtitle">${escapeHtml(item.subtitle)}</div>
      </div>
      <button class="open-btn" type="button">OPEN  ›</button>
    </div>
  `).join("");

  box.querySelectorAll(".menu-card").forEach(card => {
    const go = () => {
      if (card.dataset.leagues === "1") {
        showScreen("leagues");
        return;
      }
      openRanking(card.dataset.key, card.dataset.overall === "1", "main");
    };
    card.addEventListener("click", go);
  });
}

function buildLeaguesMenu() {
  const box = document.getElementById("leagues-list");
  box.innerHTML = Object.entries(LEAGUES).map(([name, info]) => `
    <div class="menu-card" data-league="${escapeHtml(name)}">
      <div class="icon" style="font-weight:800;font-size:1rem;color:var(--gold)">${escapeHtml(info.badge)}</div>
      <div class="sep"></div>
      <div class="texts">
        <div class="title">${escapeHtml(name)}</div>
        <div class="subtitle">League pot &amp; domestic cups</div>
      </div>
      <button class="open-btn" type="button">OPEN  ›</button>
    </div>
  `).join("");
  box.querySelectorAll(".menu-card").forEach(card => {
    card.addEventListener("click", () => openCupsMenu(card.dataset.league));
  });
}

function openCupsMenu(leagueName) {
  currentLeague = leagueName;
  const info = LEAGUES[leagueName];
  document.getElementById("cups-title").textContent = `${info.badge}  ${leagueName}`;
  const box = document.getElementById("cups-list");
  box.innerHTML = info.cups.map(cup => `
    <div class="menu-card" data-cup="${escapeHtml(cup)}">
      <div class="icon">🏆</div>
      <div class="sep"></div>
      <div class="texts">
        <div class="title">${escapeHtml(cup)}</div>
        <div class="subtitle">${escapeHtml(leagueName)} ranking pot</div>
      </div>
      <button class="open-btn" type="button">RANKING  ›</button>
    </div>
  `).join("");
  box.querySelectorAll(".menu-card").forEach(card => {
    card.addEventListener("click", () => {
      openRanking(card.dataset.cup, false, "cups");
    });
  });
  showScreen("cups");
}

function openRanking(competitionKey, isOverall, backTarget) {
  currentCompetition = competitionKey;
  currentIsOverall = !!isOverall || OVERALL_KEYS.has(competitionKey);
  rankBackTarget = backTarget || "main";
  document.getElementById("rank-title").textContent = competitionKey;
  document.getElementById("rank-subtitle").textContent = currentIsOverall
    ? "ALL COMPETITIONS  •  POINTS SUMMED"
    : "THIS COMPETITION ONLY  •  TOP PLAYERS";
  document.getElementById("search").value = "";
  document.getElementById("pos-filter").value = "";
  renderRanking();
  showScreen("rank");
}

function renderRanking() {
  const q = (document.getElementById("search").value || "").trim().toLowerCase();
  const pos = document.getElementById("pos-filter").value;

  let rows = PLAYERS.map(p => ({
    p,
    pts: playerPoints(p, currentCompetition, currentIsOverall)
  }));

  // Specific competition: only players with points in THAT pot
  if (!currentIsOverall) {
    rows = rows.filter(r => r.pts > 0);
  } else {
    // Overall: show players with any points (same spirit as Python for overall lists)
    rows = rows.filter(r => r.pts > 0);
  }

  if (pos) rows = rows.filter(r => (r.p.position || "").toUpperCase() === pos);
  if (q) {
    rows = rows.filter(r => {
      const n = (r.p.name || "").toLowerCase();
      const c = (r.p.club || "").toLowerCase();
      return n.includes(q) || c.includes(q);
    });
  }

  rows.sort((a, b) => b.pts - a.pts || (a.p.name || "").localeCompare(b.p.name || ""));

  const limit = currentIsOverall ? 100 : 50; // show more than Python's 20 for web
  const slice = rows.slice(0, limit);

  const tbody = document.getElementById("rank-tbody");
  if (slice.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-row">No players ranked yet for this competition</td></tr>`;
  } else {
    tbody.innerHTML = slice.map((r, i) => `
      <tr data-i="${PLAYERS.indexOf(r.p)}">
        <td class="rank">${i + 1}</td>
        <td>${escapeHtml(r.p.name)}</td>
        <td><span class="pos-tag">${escapeHtml(r.p.position || "-")}</span></td>
        <td class="hide-sm">${escapeHtml(r.p.club || "-")}</td>
        <td class="pts">${formatPts(r.pts)}</td>
      </tr>
    `).join("");
    tbody.querySelectorAll("tr").forEach(tr => {
      tr.addEventListener("click", () => openDetail(+tr.dataset.i));
    });
  }

  const mode = currentIsOverall
    ? "Ballon d'Or / Career — points = sum of all competitions"
    : "Competition ranking — points from this pot only";
  document.getElementById("rank-note").textContent =
    `${rows.length} player(s)  •  showing top ${Math.min(limit, rows.length)}  •  ${mode}`;
}

function openDetail(idx) {
  const p = PLAYERS[idx];
  if (!p) return;
  const comps = p.competitions || {};
  const entries = Object.entries(comps)
    .map(([k, v]) => ({ name: k, points: Number(v.points || 0), entry: v }))
    .filter(e => e.points > 0)
    .sort((a, b) => b.points - a.points);

  const total = playerPoints(p, "BALLON D'OR OVERALL POINTS", true);

  let list = entries.length
    ? entries.map(e => {
        const stats = e.entry.stats || {};
        const parts = [];
        ["goals","assists","successful_dribbles","chances_created","successful_tackles",
         "clean_sheets","saves","penalty_saves","mvp","appearances","minutes"].forEach(k => {
          const v = e.entry[k] ?? stats[k];
          if (v != null && v !== 0 && v !== "") {
            const nice = k.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
            parts.push(`<span><strong>${v}</strong> ${nice}</span>`);
          }
        });
        return `<div class="comp-item">
          <h4>${escapeHtml(e.name)} <span style="color:var(--pts-green)">${formatPts(e.points)} pts</span></h4>
          <div class="stats">${parts.join("") || "—"}</div>
        </div>`;
      }).join("")
    : `<p style="color:var(--muted)">No competition points.</p>`;

  // Highlight current competition if not overall
  let highlight = "";
  if (!currentIsOverall && currentCompetition) {
    const only = playerPoints(p, currentCompetition, false);
    highlight = `<div class="big-pts" style="margin-bottom:0.5rem">
      <span>${escapeHtml(currentCompetition)}</span>
      ${formatPts(only)} pts
    </div>`;
  }
