name: SPS automatic data sync

on:
workflow_dispatch:
schedule:
# Runs twice per day. Increase only after monitoring API quota.
- cron: "15 5,17 * * *"

permissions:
contents: write

jobs:
sync:
runs-on: ubuntu-latest

steps:
  - name: Checkout SPS
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: pip install -r requirements.txt

  - name: Sync API-Football data
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    run: python sync.py

  - name: Commit updated roster
    run: |
      git config user.name "SPS Auto Sync"
      git config user.email "actions@users.noreply.github.com"
      git add players.json
      if git diff --cached --quiet; then
        echo "No SPS data changes."
      else
        git commit -m "Auto-update SPS player data"
        git push
      fi
